<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tech Club: a student technology club. See upcoming events and join us.">
  <title>Tech Club | Home</title>
</head>

<body>

<header>
  <h1>Tech Club</h1>
  <nav>
    <a href="#about">About</a>
    <a href="#events">Events</a>
    <a href="#join">Join</a>
  </nav>
</header>

<main>

<section id="about">
  <h2>About Us</h2>
  <p>We are a student technology club learning how to build useful things on the web.</p>
</section>

<section id="events">
  <h2>Upcoming Events</h2>

  <ul>
    <li>
      <article>
        <h3>HTML Workshop</h3>
        <p>Saturday at 10am</p>
      </article>
    </li>

    <li>
      <article>
        <h3>Git Practice</h3>
        <p>Sunday at 2pm</p>
      </article>
    </li>
  </ul>
</section>

<img src="club.jpg" alt="Tech Club members learning together at a workshop">

<section id="join">
  <h2>Join the Club</h2>

  <form>
    <p>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
    </p>

    <p>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </p>

    <p>
      <label for="reason">Why do you want to join?</label>
      <textarea id="reason" name="reason" rows="5" required></textarea>
    </p>

    <button type="submit">Send my application</button>
  </form>
</section>

</main>

<footer>
  Tech Club 2026
</footer>

</body>
</html>
