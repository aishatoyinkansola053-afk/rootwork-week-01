<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Task Tracker</h1>

    <form id="task-form">
      <label for="task-input">New task</label>
      <div class="form-row">
        <input type="text" id="task-input" placeholder="e.g. Read chapter 3">
        <button type="submit">Add</button>
      </div>
      <p id="message" role="alert"></p>
    </form>

    <div class="filters">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <p id="count"></p>

    <ul id="task-list"></ul>
    <p id="empty-state" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
